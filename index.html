<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ready Steady Bang</title>
<style>
  :root{
    --ink:#12100f; --paper:#f6e7c8; --accent:#e0562f; --gold:#f2b338;
    --dim:rgba(18,16,15,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0b0a;color:var(--paper);
    font-family:"Rockwell","Courier New",ui-monospace,monospace; user-select:none}
  #stage{position:fixed;inset:0;overflow:hidden;background:#0d0b0a}
  canvas{display:block;touch-action:none}

  /* ---------- shared overlay ---------- */
  .layer{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));text-align:center;
    background:radial-gradient(ellipse at 50% 45%,rgba(10,7,6,.55) 0%,rgba(10,7,6,.86) 100%);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .layer.on{display:flex}
  .title{font-size:clamp(34px,9vw,86px);line-height:.92;letter-spacing:.02em;margin:0;
    color:var(--paper);text-shadow:0 6px 0 #7a2a12, 0 10px 26px rgba(0,0,0,.6)}
  .title em{display:block;font-style:normal;color:var(--gold)}
  .sub{margin:14px 0 26px;font-size:clamp(12px,3.4vw,17px);color:#e9d6b4;opacity:.85;max-width:34ch;line-height:1.5}
  .btn{appearance:none;border:0;cursor:pointer;font:inherit;font-size:clamp(15px,4vw,20px);
    padding:14px 30px;margin:6px;border-radius:999px;background:var(--paper);color:var(--ink);
    box-shadow:0 5px 0 #b39764; transition:transform .08s, box-shadow .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b39764}
  .btn.alt{background:var(--accent);color:#fff;box-shadow:0 5px 0 #8d2f14}
  .btn.ghost{background:transparent;color:#e9d6b4;box-shadow:none;border:2px solid rgba(233,214,180,.35)}
  .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}

  /* ---------- level select ---------- */
  #levels .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;
    width:min(560px,92vw);max-height:56vh;overflow-y:auto;padding:4px}
  .cell{position:relative;aspect-ratio:1;border-radius:14px;background:#241d19;border:2px solid #3b302a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
    color:#e9d6b4;font-size:20px;padding:4px}
  .cell.done{background:#2b2a17;border-color:var(--gold)}
  .cell.locked{opacity:.4;cursor:not-allowed}
  .cell .nm{font-size:9px;opacity:.7;letter-spacing:.04em;text-transform:uppercase}
  .cell .st{font-size:10px;color:var(--gold);letter-spacing:2px;height:12px}
  .cell .ms{font-size:9px;opacity:.6}

  /* ---------- in-game HUD ---------- */
  #hud{position:fixed;inset:0;display:none;pointer-events:none}
  #hud.on{display:block}
  #topbar{position:absolute;top:max(10px,env(safe-area-inset-top));left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:12px;
    color:#f6e7c8;text-shadow:0 2px 6px rgba(0,0,0,.7);letter-spacing:.08em}
  #topbar .back{pointer-events:auto;cursor:pointer;padding:6px 10px;border-radius:999px;
    background:rgba(0,0,0,.35)}
  #lvlname{padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.3)}
  #cue{position:absolute;left:0;right:0;top:26%;text-align:center;
    font-size:clamp(40px,13vw,120px);line-height:1;letter-spacing:.03em;
    text-shadow:0 6px 0 rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.5)}
  #cue.small{font-size:clamp(22px,7vw,58px)}
  #hint{position:absolute;left:0;right:0;bottom:14%;text-align:center;font-size:clamp(11px,3vw,15px);
    color:#f6e7c8;opacity:.75;letter-spacing:.14em}
  #dirs{position:absolute;left:0;right:0;top:52%;display:flex;justify-content:space-between;
    padding:0 8vw;font-size:clamp(34px,11vw,90px);opacity:0}
  #dirs .d{transition:transform .1s,opacity .1s;opacity:.18}
  #dirs .d.hot{opacity:1;color:var(--gold);transform:scale(1.25)}
  #pads{position:absolute;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));
    display:none;justify-content:space-between;padding:0 6vw;font-size:clamp(10px,2.8vw,14px);
    letter-spacing:.1em;text-align:center}
  #pads.on{display:flex}
  .pad{padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.35);line-height:1.5}
  .pad b{display:block;font-size:clamp(13px,3.6vw,18px);letter-spacing:.06em}
  #pad1 b{color:#7fb1e8} #pad2 b{color:#ff8a6a}

  /* ---------- result ---------- */
  #result .verdict{font-size:clamp(34px,10vw,86px);margin:0;line-height:1}
  #result .time{font-size:clamp(20px,6vw,40px);color:var(--gold);margin:10px 0 2px}
  #result .stars{font-size:clamp(20px,6vw,34px);letter-spacing:8px;color:var(--gold);height:1.2em}
  #result .note{font-size:clamp(11px,3.2vw,15px);opacity:.8;margin:8px 0 20px;max-width:32ch}
  .flash{animation:fl .25s ease-out}
  @keyframes fl{from{filter:brightness(3)}to{filter:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div id="hud">
  <div id="topbar">
    <div class="back" id="quit">&#8592; LEVELS</div>
    <div id="lvlname">LEVEL 1</div>
    <div class="back" id="mute">&#9835;</div>
  </div>
  <div id="cue"></div>
  <div id="dirs"><div class="d" id="dL">&#9664;</div><div class="d" id="dR">&#9654;</div></div>
  <div id="hint"></div>
  <div id="pads"><div class="pad" id="pad1"></div><div class="pad" id="pad2"></div></div>
</div>

<div class="layer on" id="menu">
  <h1 class="title">READY<br>STEADY<em>BANG</em></h1>
  <p class="sub">Draw on <b>BANG!</b> &mdash; not a hair sooner.
    Tap the screen, or hit <b>SPACE</b>.</p>
  <div class="row">
    <button class="btn alt" id="play">PLAY</button>
    <button class="btn" id="pick">LEVELS</button>
  </div>
  <div class="row">
    <button class="btn ghost" id="vs">2 PLAYERS &middot; SAME SCREEN</button>
  </div>
  <p class="sub" style="margin-top:22px;opacity:.55">Fastest draw so far: <span id="pb">&mdash;</span></p>
</div>

<div class="layer" id="levels">
  <h2 class="title" style="font-size:clamp(24px,7vw,48px)">PICK YOUR DUEL</h2>
  <div class="grid" id="grid"></div>
  <div class="row" style="margin-top:18px">
    <button class="btn ghost" id="toMenu">BACK</button>
    <button class="btn ghost" id="wipe">RESET SAVE</button>
  </div>
</div>

<div class="layer" id="result">
  <h2 class="verdict" id="verdict">WINNER</h2>
  <div class="time" id="rtime"></div>
  <div class="stars" id="rstars"></div>
  <p class="note" id="rnote"></p>
  <div class="row">
    <button class="btn alt" id="next">NEXT DUEL</button>
    <button class="btn" id="retry">AGAIN</button>
    <button class="btn ghost" id="toLevels">LEVELS</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>

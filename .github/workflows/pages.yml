# Builds the single-file bundle and publishes it to GitHub Pages.
# readysteadybang.html is a build artifact (see .gitignore), so it is made here
# from index.html + game.js instead of being committed.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# let the deploy job mint the Pages OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and let a newer push win
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node test/logic.js

      - name: Bundle
        run: ./build.sh

      - name: Lay out the site
        # root = the self-contained game; the same file is also served under its
        # own name so a direct link still works
        run: |
          mkdir -p site
          cp readysteadybang.html site/index.html
          cp readysteadybang.html site/readysteadybang.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
